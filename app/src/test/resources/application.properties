# The cleanup jobs run in the background; tests that need them switch the scheduler on themselves.
db-scheduler.enabled=false
# Test-only secret; real deployments set KANAKKU_INVITE_TOKEN_SECRET.
kanakku.invites.token-secret=test-only-invite-token-secret-0123456789
# Test-only secret for hashing SMS codes; real deployments set KANAKKU_SMS_CODE_SECRET.
kanakku.sms.code-secret=test-only-sms-code-secret-0123456789abcdef
# The whole suite shares one hourly ceiling bucket; tests that exercise the ceiling lower it.
kanakku.sms.max-sends-per-hour=1000000
