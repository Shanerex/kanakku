name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Spotless
        run: ./mvnw -B -q spotless:check
      - name: Test
        run: ./mvnw -B -q test
      - name: Backend version
        run: scripts/check-backend-version.sh
      - name: Package
        run: ./mvnw -B -q -DskipTests package
      - name: Jar has no web assets
        run: |
          jar=$(ls app/target/kanakku-app-*.jar | grep -v original | head -n1)
          if jar tf "$jar" | grep -E '(^|/)(static/|public/|META-INF/resources/|index\.html$)'; then
            echo "web assets found in $jar" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:version
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      # Throwaway. The base compose file has no default for it, and every `docker compose` call
      # (up, logs, down) interpolates the file, so it is set for the whole job.
      KANAKKU_INVITE_TOKEN_SECRET: ci-only-invite-secret-not-for-deployments
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --wait --build
      - name: Smoke checks
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/actuator/health/readiness
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/config.json | grep -q '"apiBaseUrl"'
          curl -fsS -D - -o /dev/null -H 'Origin: http://localhost:3000' \
            http://localhost:8080/actuator/health | grep -i '^access-control-allow-origin: http://localhost:3000'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
