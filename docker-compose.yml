services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanakku}
      POSTGRES_USER: ${POSTGRES_USER:-kanakku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanakku}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanakku} -d ${POSTGRES_DB:-kanakku}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio is no longer published on Docker Hub or Quay; pgsty/minio is a maintained fork.
    # Publisher: pgsty (Pigsty community). Tag and index digest verified on Docker Hub.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kanakku}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kanakku-dev-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kanakku}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kanakku}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kanakku}
      KANAKKU_MINIO_ENDPOINT: http://minio:9000
      KANAKKU_SMTP_HOST: mailpit
      KANAKKU_SMTP_PORT: "1025"
      KANAKKU_CORS_ALLOWED_ORIGINS: ${KANAKKU_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Regex of reverse-proxy IPs whose X-Forwarded-For / X-Forwarded-Proto the app believes
      # (for example 172\.18\.0\.5 for a TLS proxy on the compose network). Empty trusts nobody, so
      # a forged header changes nothing. Behind a TLS proxy set it, or every client shares the
      # proxy's IP in the sign-in throttle and the session cookie is not marked Secure. The proxy
      # must overwrite, not append to, any X-Forwarded-For sent by the client.
      KANAKKU_TRUSTED_PROXIES: ${KANAKKU_TRUSTED_PROXIES:-}
      # SESSION and XSRF-TOKEN cookies are Secure, which is what a deployment behind TLS needs.
      # Browsers still accept them from http://localhost (Chrome, Firefox). For plain HTTP on
      # another host or in Safari, and for the Playwright e2e run, add docker-compose.dev.yml,
      # the only place the opt-out is set.
      KANAKKU_AUTH_SECURE_COOKIES: "true"
      # Optional SMS provider for phone verification (a generic HTTP webhook; none is bundled).
      # Leave the URL empty and phone numbers stay unverified. With a URL, KANAKKU_SMS_CODE_SECRET
      # (32+ characters) is required, and the URL must be https unless its host is on a private
      # network. Codes go only to the country calling codes listed (default 91, India); widen with
      # for example 91,1,44. The send ceiling is codes per hour for the whole instance.
      KANAKKU_SMS_WEBHOOK_URL: ${KANAKKU_SMS_WEBHOOK_URL:-}
      KANAKKU_SMS_WEBHOOK_TOKEN: ${KANAKKU_SMS_WEBHOOK_TOKEN:-}
      KANAKKU_SMS_CODE_SECRET: ${KANAKKU_SMS_CODE_SECRET:-}
      KANAKKU_SMS_ALLOWED_CALLING_CODES: ${KANAKKU_SMS_ALLOWED_CALLING_CODES:-91}
      KANAKKU_SMS_MAX_SENDS_PER_HOUR: ${KANAKKU_SMS_MAX_SENDS_PER_HOUR:-200}
      # Invite link tokens are derived from this (at least 32 characters). There is no default: a
      # value published in the repo would let any member forge an invite token. Set it in .env
      # (for example `openssl rand -hex 32`); `make up-dev` supplies a throwaway one.
      KANAKKU_INVITE_TOKEN_SECRET: ${KANAKKU_INVITE_TOKEN_SECRET:?set KANAKKU_INVITE_TOKEN_SECRET in .env (32+ characters, for example openssl rand -hex 32)}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: web
    ports:
      - "3000:8080"
    environment:
      KANAKKU_API_BASE_URL: ${KANAKKU_API_BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
